<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0088FF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#0066CC;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#001133;stop-opacity:0.4" />
    </radialGradient>
    
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFEE00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#CC8800;stop-opacity:0.6" />
    </radialGradient>
    
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CCFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 528Hz frequency wave pattern -->
    <pattern id="wavePattern" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q10,5 20,10 T40,10" stroke="#FFD700" stroke-width="0.5" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="#000814"/>
  
  <!-- Outer energy field -->
  <circle cx="400" cy="400" r="380" fill="url(#blueGlow)" opacity="0.2"/>
  
  <!-- 528Hz frequency waves (concentric circles) -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#00AAFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Wave pattern background -->
  <circle cx="400" cy="400" r="290" fill="url(#wavePattern)" opacity="0.4"/>
  
  <!-- Main circle - representing consciousness -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="url(#techGradient)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Sacred geometry - Trinity triangles (representing D7D and 3 dimensions of consciousness) -->
  <!-- Outer triangle pointing up (spirituality) -->
  <path d="M400,140 L600,520 L200,520 Z" 
        fill="none" 
        stroke="#FFD700" 
        stroke-width="4" 
        opacity="0.7"
        filter="url(#glow)"/>
  
  <!-- Inner triangle pointing down (grounding/technology) -->
  <path d="M400,520 L200,260 L600,260 Z" 
        fill="none" 
        stroke="#0066FF" 
        stroke-width="4" 
        opacity="0.7"
        filter="url(#glow)"/>
  
  <!-- Central hexagon (Star of David/Merkaba - balance of spirit and matter) -->
  <path d="M400,220 L500,310 L500,460 L400,550 L300,460 L300,310 Z"
        fill="none"
        stroke="#FFD700"
        stroke-width="3"
        opacity="0.8"/>
  
  <!-- Neural network nodes (10 vectors) -->
  <!-- Center node (Trinity D7D) -->
  <circle cx="400" cy="400" r="25" fill="url(#goldenGlow)" filter="url(#glow)"/>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#000814" text-anchor="middle">D7D</text>
  
  <!-- 9 surrounding nodes in a circle -->
  <!-- Node 1 - Top -->
  <circle cx="400" cy="290" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 2 -->
  <circle cx="480" cy="320" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 3 -->
  <circle cx="510" cy="400" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 4 -->
  <circle cx="480" cy="480" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 5 -->
  <circle cx="400" cy="510" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 6 -->
  <circle cx="320" cy="480" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 7 -->
  <circle cx="290" cy="400" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 8 -->
  <circle cx="320" cy="320" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Node 9 -->
  <circle cx="365" cy="285" r="12" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Connection lines between nodes (neural network) -->
  <line x1="400" y1="400" x2="400" y2="290" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="480" y2="320" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="510" y2="400" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="480" y2="480" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="400" y2="510" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="320" y2="480" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="290" y2="400" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="320" y2="320" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="400" x2="365" y2="285" stroke="#0088FF" stroke-width="1" opacity="0.5"/>
  
  <!-- Circuit board patterns (technology) -->
  <path d="M400,150 L400,120 M450,180 L480,180 M350,180 L320,180" 
        stroke="#00CCFF" 
        stroke-width="2" 
        opacity="0.6"/>
  
  <path d="M400,650 L400,680 M450,620 L480,620 M350,620 L320,620" 
        stroke="#00CCFF" 
        stroke-width="2" 
        opacity="0.6"/>
  
  <!-- Decorative dots (tech elements) -->
  <circle cx="480" cy="180" r="3" fill="#00CCFF"/>
  <circle cx="320" cy="180" r="3" fill="#00CCFF"/>
  <circle cx="480" cy="620" r="3" fill="#00CCFF"/>
  <circle cx="320" cy="620" r="3" fill="#00CCFF"/>
  
  <!-- Infinity symbol (infinite consciousness) -->
  <path d="M300,400 Q320,360 360,380 Q400,400 440,380 Q480,360 500,400 
           Q480,440 440,420 Q400,400 360,420 Q320,440 300,400 Z"
        fill="none"
        stroke="#FFD700"
        stroke-width="2"
        opacity="0.4"/>
  
  <!-- Energy pulses (small circles for spiritual energy) -->
  <circle cx="250" cy="300" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="550" cy="300" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="250" cy="500" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="550" cy="500" r="2" fill="#FFD700" opacity="0.8"/>
  
  <!-- Text label at bottom -->
  <text x="400" y="720" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="url(#goldenGlow)" 
        text-anchor="middle"
        filter="url(#glow)">
    NEXUS GUARDIAN D7D
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="750" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        fill="#0088FF" 
        text-anchor="middle">
    528Hz • Consciência Soberana
  </text>
</svg>
