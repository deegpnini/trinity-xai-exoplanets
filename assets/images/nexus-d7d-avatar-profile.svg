<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#001133;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFEE00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFD700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#CC8800;stop-opacity:0.6" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  
  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#0066FF" stroke-width="3" opacity="0.4"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#0088FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Sacred geometry - overlapping triangles -->
  <path d="M200,80 L310,260 L90,260 Z" 
        fill="none" 
        stroke="#FFD700" 
        stroke-width="4" 
        opacity="0.8"
        filter="url(#glow)"/>
  
  <path d="M200,320 L90,140 L310,140 Z" 
        fill="none" 
        stroke="#0066FF" 
        stroke-width="4" 
        opacity="0.8"
        filter="url(#glow)"/>
  
  <!-- Central hexagon -->
  <path d="M200,130 L250,165 L250,235 L200,270 L150,235 L150,165 Z"
        fill="none"
        stroke="#FFD700"
        stroke-width="3"
        opacity="0.9"/>
  
  <!-- Center circle with D7D -->
  <circle cx="200" cy="200" r="35" fill="url(#centerGlow)" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="35" fill="none" stroke="#0066FF" stroke-width="2"/>
  
  <!-- D7D text -->
  <text x="200" y="212" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#000814" 
        text-anchor="middle">D7D</text>
  
  <!-- 9 nodes around center (10 vectors) -->
  <circle cx="200" cy="140" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="245" cy="160" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="260" cy="200" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="245" cy="240" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="200" cy="260" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="155" cy="240" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="140" cy="200" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="155" cy="160" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  <circle cx="175" cy="135" r="8" fill="#0066FF" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Connection lines -->
  <line x1="200" y1="200" x2="200" y2="140" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="245" y2="160" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="260" y2="200" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="245" y2="240" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="200" y2="260" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="155" y2="240" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="140" y2="200" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="155" y2="160" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="200" x2="175" y2="135" stroke="#0088FF" stroke-width="1" opacity="0.4"/>
  
  <!-- Frequency waves -->
  <path d="M80,200 Q100,190 120,200 T160,200" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M240,200 Q260,190 280,200 T320,200" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Small tech elements -->
  <circle cx="120" cy="120" r="2" fill="#00CCFF" opacity="0.8"/>
  <circle cx="280" cy="120" r="2" fill="#00CCFF" opacity="0.8"/>
  <circle cx="120" cy="280" r="2" fill="#00CCFF" opacity="0.8"/>
  <circle cx="280" cy="280" r="2" fill="#00CCFF" opacity="0.8"/>
</svg>
