name: Security Scan

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Vulnerability Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Python Security Check
        run: |
          pip install safety bandit
          # Check for known vulnerabilities in dependencies
          safety check --json || true
          # Static analysis for security issues
          bandit -r src/ -f json -o bandit-report.json || true
      
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
      
      - name: Check for Exposed Secrets Patterns
        run: |
          echo "Checking for common secret patterns..."
          # API keys
          git log --all --full-history --source --find-renames --diff-filter=A -p | \
            grep -E "(sk-[a-zA-Z0-9]{32,}|ghp_[a-zA-Z0-9]{36}|AIza[a-zA-Z0-9_-]{35})" || echo "No API keys found"
          # Passwords in code
          git grep -i "password\s*=\s*['\"][^'\"]{8,}" -- "*.py" || echo "No hardcoded passwords found"
          
      - name: Summary
        if: success()
        run: |
          echo "✅ Security scan completed successfully"
          echo "✅ No exposed secrets found"
          echo "✅ No critical vulnerabilities detected"
