name: Nexus Guardian CI

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Check code style
      run: |
        pip install black flake8
        black --check src/ tests/ || echo "Black formatting check failed"
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || echo "Flake8 check failed"

  safety-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify ethical components exist
      run: |
        # Ensure ethical override system is present
        grep -r "ethical_override" src/core/nexus_synthesis.py
        grep -r "safety_check" src/core/claude_ethics.py
        # Ensure no external data transmission
        ! grep -r "requests.post" src/ || (echo "External POST found!" && exit 1)
        echo "Safety checks passed"

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Check documentation exists
      run: |
        test -f docs/ARCHITECTURE.md
        test -f docs/ETHICAL_FRAMEWORK.md
        test -f docs/CONTRIBUTING.md
        test -f CODE_OF_CONDUCT.md
        test -f LICENSE
        echo "All required documentation present"
